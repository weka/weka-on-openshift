apiVersion: weka.weka.io/v1alpha1
kind: WekaCluster
metadata:
  name: cluster-dev
  namespace: weka-operator-system
spec:
  template: dynamic
  dynamicTemplate:
    computeContainers: 6
    driveContainers: 6
    driveCores: 1
  image: quay.io/weka.io/weka-in-container:4.4.10.183 # Replace with actual image tag.
  driversDistService: "https://drivers.weka.io" # Set to https://weka-drivers-dist.weka-operator-system.svc.cluster.local:60002 if building drivers locally.
  imagePullSecret: "quay-io-robot-secret" # Replace with the actual secret.
  network: #[1-2] required if underlying h/w doesn't support DPDK.
    udpMode: true #[2-2] required if underlying h/w doesn't support DPDK.
