additionalTrustBundlePolicy: Proxyonly
apiVersion: v1
baseDomain: balarcert.com
credentialsMode: Manual
compute:
- architecture: amd64
  hyperthreading: Enabled
  name: worker
  platform:
    aws:
      metadataService: {}
      rootVolume:
        iops: 0
        size: 100
        type: gp3
      type: i4i.4xlarge
      zones:
      - us-east-2a
  replicas: 3
controlPlane:
  architecture: amd64
  hyperthreading: Enabled
  name: master
  platform:
    aws:
      metadataService: {}
      rootVolume:
        iops: 0
        size: 100
        type: gp3
      type: i4i.4xlarge
      zones:
      - us-east-2a
  replicas: 3
credentialsMode: Manual
metadata:
  name: ocpweka
networking:
  clusterNetwork:
  - cidr: 10.128.0.0/14
    hostPrefix: 23
  machineNetwork:
  - cidr: 10.0.0.0/16
  networkType: OVNKubernetes
  serviceNetwork:
  - 172.30.0.0/16
platform:
  aws:
    ipFamily: IPv4
    region: us-east-2
    vpc: {}
publish: External
pullSecret: {$PULL_SECRET}
