---
apiVersion: weka.weka.io/v1alpha1
kind: WekaClient
metadata:
  name: cluster-dev-clients
  namespace: weka-operator-system
spec:
  image: quay.io/weka.io/weka-in-container:4.4.10.183 # Replace with required WEKA image value
  imagePullSecret: "quay-io-robot-secret" # Replace with the actual value
  driversDistService: "https://drivers.weka.io" # Set to https://weka-drivers-dist.weka-operator-system.svc.cluster.local:60002 if building drivers locally.
  portRange:
    basePort: 46000
  wekaSecretRef: weka-client-cluster-dev # Must match secret name created using secret yaml
  targetCluster:
    name: cluster-dev
    namespace: weka-operator-system
  network: #[1-2] required if underlying h/w doesn't support DPDK.
    udpMode: true #[2-2] required if underlying h/w doesn't support DPDK.
